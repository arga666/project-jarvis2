name: Build & Release Jarvis APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Generate Clean Android Project & Apply Custom Manifest
        run: |
          mkdir -p /tmp/jarvis_backup
          mv pubspec.yaml /tmp/jarvis_backup/
          mv lib /tmp/jarvis_backup/
          flutter create --platforms=android --org com.arga666 --project-name project_jarvis .
          rm -rf pubspec.yaml lib test
          mv /tmp/jarvis_backup/pubspec.yaml .
          mv /tmp/jarvis_backup/lib .
          cp config/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/g' android/app/build.gradle
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' android/app/build.gradle
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/g' android/app/build.gradle

      - name: Fix Gradle Namespace & JVM Target for Plugins
        run: |
          cat << 'GRADLE_EOF' >> android/build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 34
                          compileOptions {
                              sourceCompatibility JavaVersion.VERSION_17
                              targetCompatibility JavaVersion.VERSION_17
                          }
                          if (namespace == null) {
                              namespace project.group.toString()
                          }
                      }
                  }
                  project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                      kotlinOptions {
                          jvmTarget = "17"
                      }
                  }
              }
          }
          GRADLE_EOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Jarvis AI v1.0.${{ github.run_number }} (Ready to Install)"
          files: build/app/outputs/flutter-apk/app-release.apk
