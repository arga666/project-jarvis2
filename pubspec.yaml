name: project_jarvis
description: Jarvis Personal AI Assistant with Floating Orb & Gaming Mode.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_generative_ai: ^0.4.6
  flutter_overlay_window: ^0.4.5
  flutter_background_service: ^5.0.10
  flutter_background_service_android: ^6.2.6
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2
  sqflite: ^2.3.3+1
  path: ^1.9.0
  android_intent_plus: ^5.1.0
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.2
  intl: ^0.19.0

flutter:
  uses-material-design: true
